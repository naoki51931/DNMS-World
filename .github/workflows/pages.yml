name: DNMS World Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: dnms-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: gradle --no-daemon test exportTerrain
      - run: npm install --no-audit --no-fund && npm run build
        working-directory: client
      - name: Verify static PWA
        run: |
          test -s client/dist/index.html
          test -s client/dist/terrain.json
          test -s client/dist/manifest.webmanifest
          test -s client/dist/sw.js
          test -s client/dist/icon.svg
          node --check client/dist/sw.js
          touch client/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
