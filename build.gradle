plugins { id 'java' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies { testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
test {
 useJUnitPlatform()
 testLogging { events 'failed'; exceptionFormat 'full'; showCauses true; showStackTraces true }
}

tasks.register('exportTerrain', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.nagineco.world.TerrainExport'
    args file('client/public/terrain.json').absolutePath
}

def upstreamHashes = [NaoBuildingPlan: 'd7e5d9c6981d540942ef713943aaedf037ef14b2',
PhysicalSkillSync: 'c1c29257e2e9e1f2fbef05234ab4c5487431e9e7',
PhysicalMovementPerformance: '0548c6a00d3548af1a77b84dc97294efa118c33c',
PhysicalWorkPerformance: 'fc8389f5a5ac6b76d044256d944606e272db9fe2',
PhysicalBuildPerformance: 'f9e4dbe69810aa7a40fcbb407d2e729d99f5e6ac']
tasks.register('fetchDnmsPlan') {
    inputs.properties(upstreamHashes)
    outputs.files(upstreamHashes.keySet().collect { layout.buildDirectory.file("upstream/org/nagineco/doppel/core/${it}.java") })
    doLast {
        upstreamHashes.each { name, expected ->
            def target = layout.buildDirectory.file("upstream/org/nagineco/doppel/core/${name}.java").get().asFile
            def connection = new URI("https://raw.githubusercontent.com/naoki51931/DNMS_Doppelganger-NPC-Manegement-System/main/src/main/java/org/nagineco/doppel/core/${name}.java").toURL().openConnection()
            connection.connectTimeout = 15000
            connection.readTimeout = 15000
            byte[] bytes = connection.inputStream.withCloseable { it.readAllBytes() }
            def digest = java.security.MessageDigest.getInstance('SHA-1')
            digest.update(("blob " + bytes.length + "\u0000").getBytes('UTF-8'))
            if (digest.digest(bytes).encodeHex().toString() != expected) throw new GradleException("Upstream changed: ${name}")
            target.parentFile.mkdirs()
            target.bytes = bytes
        }
    }
}
sourceSets.main.java.srcDir(layout.buildDirectory.dir('upstream'))
tasks.named('compileJava') { dependsOn 'fetchDnmsPlan' }

tasks.register('exportNaoReplay', JavaExec) {
 dependsOn classes
 classpath = sourceSets.main.runtimeClasspath
 mainClass = 'org.nagineco.world.NaoReplayExport'
 args file('client/public/nao-replay.json').absolutePath
}
tasks.named('exportTerrain') { dependsOn 'exportNaoReplay' }

tasks.register('runLive', JavaExec) {
 dependsOn classes
 classpath = sourceSets.main.runtimeClasspath
 mainClass = 'org.nagineco.world.NaoLiveServer'
 args file('client/dist').absolutePath
}

tasks.register('fetchDnmsMip') {
 def target=layout.buildDirectory.file('upstream/org/nagineco/patch/memoryintegration/MemoryIntegrationPatch.java')
 inputs.property('blobHash','9380c13d8393f8edfca33ca7e261426c3fe0d3c7')
 outputs.file(target)
 doLast {
  def c=new URI('https://raw.githubusercontent.com/naoki51931/DNMS_Doppelganger-NPC-Manegement-System/main/patches/memory-integration/src/org/nagineco/patch/memoryintegration/MemoryIntegrationPatch.java').toURL().openConnection()
  c.connectTimeout=15000;c.readTimeout=15000
  byte[] bytes=c.inputStream.withCloseable { it.readAllBytes() }
  def digest=java.security.MessageDigest.getInstance('SHA-1')
  digest.update(("blob "+bytes.length+"\u0000").getBytes('UTF-8'))
  if(digest.digest(bytes).encodeHex().toString()!='9380c13d8393f8edfca33ca7e261426c3fe0d3c7')throw new GradleException('Upstream MIP changed')
  def file=target.get().asFile;file.parentFile.mkdirs();file.bytes=bytes
 }
}
tasks.named('compileJava') { dependsOn 'fetchDnmsMip' }

